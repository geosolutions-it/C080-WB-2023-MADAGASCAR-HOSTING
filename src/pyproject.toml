[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mad_geonode4"
version = "0.0.1"
description = "MADAGASCAR Project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["project", "geonode", "django"]

# Equivalent modern replacement for dependency_links:
dependencies = [
  "GeoNode==5.1.1",
  "django-modeltranslation==0.20.6"
]

[project.urls]
Homepage = "https://github.com/geosolutions-it/C080-WB-2023-MADAGASCAR-HOSTING"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Equivalent to find_packages()
where = ["."]

# Enable this entry if the app is providing rdf files
#[tool.setuptools.package-data]
#"*" = ["**/thesauri/*.rdf"]